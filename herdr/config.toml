onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "login"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
remote_image_paste = "cmd+v"

next_workspace = "prefix+shift+j"
previous_workspace = "prefix+shift+k"
switch_workspace = "prefix+shift+1..9"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

goto = "prefix+s"
settings = "prefix+g"

[ui]
prompt_new_tab_name = false
copy_on_select = true
tab_bar_position = "top"
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
accent = "green"

[ui.sidebar.agents]
rows = [
  [
    { token = "state_icon" },
    { token = "workspace", bold = false },
    { token = "tab", bold = false },
  ],
  [{ token = "agent", bold = false }],
]

[ui.sidebar.spaces]
rows = [
  [{ token = "state_icon" }, { token = "workspace", bold = false }],
  [
    { token = "branch", bold = false },
    { token = "git_status", bold = false },
  ],
]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[theme]
auto_switch = false
name = "terminal"

[experimental]
allow_nested = false
