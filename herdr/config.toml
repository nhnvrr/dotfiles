onboarding = false

[terminal]
default_shell = "/bin/zsh"
shell_mode = "login"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
remote_image_paste = "cmd+v"

next_workspace = "prefix+shift+j"
previous_workspace = "prefix+shift+k"
switch_workspace = "prefix+shift+1..9"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

goto = "prefix+s"
settings = "prefix+g"
toggle_sidebar = "prefix+b"

[ui]
prompt_new_tab_name = false
copy_on_select = true
tab_bar_position = "top"
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true

# One row shape for every agent, and no rows_by_agent: the per-agent block only
# existed to give claude the $icon column, which left every other agent's second
# column holding the workspace name instead — the two panels stopped lining up.
#
# state_icon and not state_text: the text spells the state out, and `done` is
# five cells of a fixed-width column that push the workspace name off the end.
[ui.sidebar.agents]
rows = [
  [
    { token = "state_icon" },
    { token = "$icon" },
    { token = "workspace", bold = false },
    { token = "tab", bold = false },
  ],
  [{ token = "agent", bold = false }],
]

[ui.sidebar.spaces]
rows = [
  [
    { token = "state_icon" },
    { token = "$icon" },
    { token = "workspace", bold = false },
  ],
  [
    { token = "branch", bold = false },
    { token = "git_status", bold = false },
  ],
]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[theme]
auto_switch = false
name = "gruvbox"

