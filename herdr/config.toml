onboarding = false

# herdr comes from the Brewfile, so Homebrew owns the version. Left on, the
# background check nags about releases that `brew upgrade` installs anyway, and
# `herdr update` would write over the Cellar behind Homebrew's back.
# manifest_check stays on: agent detection is data, not the binary, and it is
# what keeps a new agent's state readable in the sidebar without an upgrade.
[update]
version_check = false

[terminal]
default_shell = "/bin/zsh"
shell_mode = "login"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
remote_image_paste = "cmd+v"

next_workspace = "prefix+shift+j"
previous_workspace = "prefix+shift+k"
switch_workspace = "prefix+shift+1..9"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

goto = "prefix+s"
settings = "prefix+g"
toggle_sidebar = "prefix+b"

[ui]
prompt_new_tab_name = false
copy_on_select = true
tab_bar_position = "top"
agent_panel_sort = "priority"

# Shapes, not four colours of the same dot. The default `dots` carries the
# whole distinction in hue, which is the one thing the rest of this stack never
# relies on alone — and it replaces the per-pane --state-label round-trip that
# zsh/zshrc used to send, since this reaches every pane, not just the ones that
# sourced that file.
status_indicators = "symbols"

# Kanso Ink's bright blue, the same accent the agent rows use below. Left alone
# herdr picks a generic cyan that matches nothing else on screen.
accent = "#7fb4ca"

# 36 truncates a worktree branch at `chore/sc-109…` — and the ticket number is
# the only thing telling two worktrees of the same repo apart. The width still
# auto-scales; this only lifts the ceiling.
sidebar_max_width = 44

# The scrollbar column lands inside terminal-native selections, and
# copy_on_select above makes that a copy of the wrong thing.
pane_scrollbars = false

# Empty on purpose: herdr's default is "{hostname}: {workspace}", which it
# recomputes and writes to the outer terminal on every workspace switch. The
# window already says which project it is; this is work for nothing.
window_title = ""

show_agent_labels_on_pane_borders = true

# The fallback shape, used by any agent without an entry in rows_by_agent below.
#
# Row 1 is byte-identical across all three blocks — only the agent name's colour
# on row 2 differs, which no other key can express, since herdr takes complete
# row overrides and offers no per-agent colour of its own. Any drift in row 1
# and the agents panel stops lining up with the spaces panel.
#
# state_icon and not state_text: the text spells the state out, and `done` is
# five cells of a fixed-width column that push the workspace name off the end.
[ui.sidebar.agents]
rows = [
  [
    { token = "state_icon" },
    { token = "workspace", bold = false },
    { token = "tab", bold = false },
  ],
  # state_text spelled out, and on row 2 rather than row 1: the words are
  # variable-width and would push the workspace name off the end of row 1, which
  # is the column that has to stay aligned with the spaces panel. Row 2 has the
  # slack. Between the symbol on row 1 and the word here, the state reads
  # without depending on hue at all.
  #
  # `agent` carries an explicit fg and no dim. Left to the theme it inherits
  # subtext0, and herdr already renders the second row at reduced intensity — the
  # two stack and the agent name washes out to near-invisible against #32302f.
  # The hex is ANSI slot 12, the same accent the sidebar uses elsewhere.
  #
  # No dim on state_text either, for the same reason: herdr colours it by state,
  # and dimming a signal that exists to be noticed defeats it.
  [{ token = "agent", fg = "#a4c6bf", bold = false }, { token = "state_text" }],
]

# Per-agent colour, and nothing else. Row 1 is copied verbatim from the block
# above — herdr takes complete row overrides, so it has to be repeated, and if
# it ever drifts the agents panel stops lining up with the spaces panel.
#
# The colour answers "whose pane is this" at a glance, which is the question a
# sidebar with several agents actually gets asked.
#
# #b6927b is the theme's own indexed colour 16, which alacritty.toml also
# defines — the one warm hue far enough from both the blue above and the yellow
# state_text uses to tell the two agents apart at a glance.
[ui.sidebar.agents.rows_by_agent]
claude = [
  [
    { token = "state_icon" },
    { token = "workspace", bold = false },
    { token = "tab", bold = false },
  ],
  [{ token = "agent", fg = "#b6927b", bold = false }, { token = "state_text" }],
]

codex = [
  [
    { token = "state_icon" },
    { token = "workspace", bold = false },
    { token = "tab", bold = false },
  ],
  # Plain text, the maximum separation from the peach above without reaching
  # for a hue that means something else.
  [{ token = "agent", fg = "#C5C9C7", bold = false }, { token = "state_text" }],
]

[ui.sidebar.spaces]
rows = [
  [
    { token = "state_icon" },
    { token = "workspace", bold = false },
  ],
  [
    { token = "branch", bold = false },
    { token = "git_status", bold = false },
  ],
]

[ui.toast]
delivery = "herdr"
# A debounce, not a duration threshold: herdr notifies only if the pane is still
# in that state when this expires. 1s fires on an agent that flickers through
# `done` on its way somewhere else — cheap when it was a silent toast, less so
# now that it plays a two-second sample.
delay_seconds = 3

[ui.sound]
enabled = true

# Age of Empires 2, and the pair is the point: "done" and "needs input" are two
# different events and the default plays one sound for both. Siege Workshop for
# a finished agent, Unit Creation for one waiting on you — distinguishable from
# the next room without looking at the screen.
#
# mp3 is the only format herdr accepts; the .aiff under /System/Library/Sounds
# has to be converted first. These two are already mp3, 1.6s and 2.4s.
#
# The path is relative on purpose. herdr resolves it from the config file's
# directory, and that file is a symlink — so it lands either in ~/.config/herdr
# or in the repo's herdr/, depending on whether the symlink is resolved first.
# install.sh links sounds/ into ~/.config/herdr/, so `sounds/…` is a real file
# under both readings and the ambiguity stops mattering.
done_path = "sounds/done.mp3"
request_path = "sounds/request.mp3"

# Kanso Ink, matching alacritty/alacritty.toml slot for slot. herdr's theme
# tokens accept no ANSI reference, so this is the one place besides
# nvim/init.lua that has to restate the palette as hex.
[theme]
auto_switch = false
# The base only fills tokens [theme.custom] leaves alone; every token herdr
# exposes is overridden below, so the name is a floor, not the look.
name = "terminal"

[theme.custom]
# Surfaces, straight off the theme's own bg0-bg4 ramp. panel_bg matches the
# terminal background so herdr does not paint its own ground behind the blur.
panel_bg    = "#14171d"   # bg0, the terminal background
sidebar_bg  = "#14171d"
# bg0 again, and it has to be: bg0 is the darkest value the palette defines, so
# there is nothing to sit below the ground.
surface_dim = "#14171d"
surface0    = "#1f1f26"   # bg1 — the selected row
surface1    = "#22262D"   # bg2 — raised fills
overlay0    = "#393B44"   # bg3 — borders, menus, and the terminal's selection
overlay1    = "#4b4e57"   # bg4

active_row_bg = "#1f1f26"
selection_bg  = "#22262D"

# subtext0 is ANSI slot 8, which holds 7.39:1 on this background — the value
# alacritty.toml carries precisely because it paints dim text everywhere.
text     = "#C5C9C7"
subtext0 = "#A4A7A4"

# Hues, by ANSI slot. The bright half where herdr uses a colour to carry meaning
# on a dark panel, the normal half where it is decoration.
accent = "#7fb4ca"   # slot 12
blue   = "#8ba4b0"   # slot 4
mauve  = "#938aa9"   # slot 13
green  = "#87a987"   # slot 10
yellow = "#e6c384"   # slot 11
red    = "#e46876"   # slot 9
teal   = "#7aa89f"   # slot 14
peach  = "#c4b28a"   # slot 3

[experimental]
allow_nested = false
