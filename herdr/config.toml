onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "login"
new_cwd = "follow"

[keys]
# The stock default, free now that tmux is not the outer layer. Two things it
# takes inside herdr panes: nvim's CTRL-B, which is page up, and fish's
# backward-char. Run herdr nested in tmux and it needs pressing twice.
prefix = "ctrl+b"
# Raw key, no prefix accepted, and only ever live under `herdr --remote` — where
# the agent runs on the far side and cannot read this machine's clipboard. It
# costs fish nothing locally, which is why it is left at the stock ctrl+v.
remote_image_paste = "ctrl+v"

# Herdr ships these six unbound, and they are the sidebar's whole point: moving
# between workspaces and between agents without stopping at the picker.
# Workspaces and agents are both vertical lists, hence shift+j/k over h/l.
next_workspace = "prefix+shift+j"
previous_workspace = "prefix+shift+k"
switch_workspace = "prefix+shift+1..9"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

[ui]
# ctrl+b c opens the tab straight away; the name prompt is what made it slow.
prompt_new_tab_name = false
copy_on_select = true
tab_bar_position = "top"
# By ANSI name and not the hex it used to be, so it resolves through the same
# sixteen slots as everything else and follows the day/night switch. herdr's own
# default for this key is a name too.
accent = "cyan"
# The agents are the reason this is installed, so sort them by attention.
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[theme]
# herdr ships native themes for all three families and both halves of each, which
# are more faithful to them than deriving the chrome from the sixteen slots would
# be. `name` below is rewritten by the `theme` fish function on every switch; this
# file is deployed as a copy rather than a symlink because of it, the same as
# pgcli's.
#
# One resolved name, and auto_switch deliberately OFF, which is the opposite of
# how this started. auto_switch has herdr pick the half by asking the terminal for
# its background — and it did not follow, so the half had to be changed by hand
# inside herdr. That is the part that bites: changing it in the UI makes herdr
# write its choice back here as `name` and set auto_switch = false itself, and from
# then on the two *_name keys it had been choosing between are ignored and herdr is
# pinned for good. Writing the resolved name outright has nothing to detect and
# nothing to lose a race with, and it overwrites whatever the UI persisted.
auto_switch = false
name = "gruvbox"

[experimental]
# herdr inside tmux is not herdr inside herdr, but if it ever refuses to start
# in a tmux pane this is the switch that lets it.
allow_nested = false
