#? Config file for btop v.1.4.7

# Only the keys that differ from the defaults. btop fills in every one it does
# not find here, and the file stays this short because of save_config_on_exit
# below.

#* false, or btop rewrites this file on every quit — and since it is a symlink
#* into the repo, that means a git diff each time btop is closed. Off, the repo
#* is the source of truth and settings changed in the UI are deliberately
#* thrown away on exit.
save_config_on_exit = false

#* Bare name, not a path: btop resolves it against ~/.config/btop/themes. The
#* previous config had the full Cellar path with the brew version inside it,
#* which broke on the next btop upgrade.
#*
#* "current" and not "nord-slots" because that name is a symlink the `theme`
#* fish function repoints between nord-slots.theme and nord-slots-light.theme.
#* Switching by moving the link is what keeps this file — a symlink into the
#* repo — out of every toggle's way.
color_theme = "current"

#* The theme leaves main_bg empty; this is the switch that actually makes btop
#* honour the terminal's background.
theme_background = false

truecolor = true
