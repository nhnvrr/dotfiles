# Only what differs from btop 1.4.7's own defaults. Every key left out is
# regenerated at its default, so the full 79-line dump this replaced said
# nothing that btop would not have said by itself.

# The whole point: no palette of its own, so btop follows the terminal's
# sixteen ANSI slots and `mate` switches it with everything else.
color_theme = "TTY"

# proc first: this is opened to find what is eating the machine.
shown_boxes = "proc mem net cpu"
proc_sorting = "user"

# Fixed 100 Mib/s scale. Auto rescales to the current traffic, which makes an
# idle link look as busy as a saturated one.
net_auto = false

# NOT btop's default, and the reason this file stayed noisy: it is symlinked
# into the repo, so leaving this on means quitting btop writes 79 lines of
# generated state back over these four.
save_config_on_exit = false
