"$schema" = 'https://starship.rs/config-schema.json'

format = """$shell$directory($git_branch$git_commit$git_state$git_status$git_metrics )\
$status$jobs$nodejs$bun$golang$rust$python$terraform$kubernetes$docker_context$hostname\
$line_break$character"""
right_format = '$aws$cmd_duration$time'
add_newline = true
command_timeout = 300
scan_timeout = 10

[directory]
style = 'bright-white'
repo_root_style = 'bright-white'
before_repo_root_style = 'bright-white'
truncate_to_repo = false
truncation_length = 0
read_only = ' 󰌾'
read_only_style = 'red'
format = '[$path]($style)[$read_only]($read_only_style) '

[shell]
disabled = false
zsh_indicator = ''
fish_indicator = '\[fish\] '
bash_indicator = '\[bash\] '
unknown_indicator = '\[sh\] '
style = 'bold yellow'
format = '[$indicator]($style)'

[character]
success_symbol = '[❯](bright-green)'
error_symbol = '[❯](bright-red)'
vimcmd_symbol = '[❮](bright-green)'
vimcmd_replace_symbol = '[▶](bright-purple)'
vimcmd_replace_one_symbol = '[▶](bright-purple)'
vimcmd_visual_symbol = '[V](bright-yellow)'

[git_branch]
symbol = ' '
style = 'bold green'
only_attached = true
format = '\[[$symbol$branch(:$remote_branch)]($style)\]'

[git_commit]
only_detached = true
tag_disabled = false
tag_symbol = ' '
style = 'bright-black'
format = '\[[$hash$tag]($style)\]'

[git_state]
style = 'red'
format = '\[[$state( $progress_current/$progress_total)]($style)\]'

[git_status]
ignore_submodules = true
style = 'bright-black'
format = '([\[](bright-black)$conflicted$stashed$deleted$renamed$modified$staged$untracked$ahead_behind[\]](bright-black))'
conflicted = '[=${count}](red)'
stashed = '[\$${count}](cyan)'
deleted = '[✘${count}](red)'
renamed = '[»${count}](yellow)'
modified = '[*${count}](yellow)'
staged = '[+${count}](green)'
untracked = '[?${count}](purple)'
ahead = '[⇡${count}](cyan)'
behind = '[⇣${count}](cyan)'
diverged = '[⇡${ahead_count}⇣${behind_count}](cyan)'
up_to_date = ''

[git_metrics]
disabled = false
added_style = 'green'
deleted_style = 'red'
format = '(\[[+$added]($added_style)\])(\[[-$deleted]($deleted_style)\])'

[status]
disabled = false
style = 'bright-red'
symbol = ' '
map_symbol = true
recognize_signal_code = true
sigint_symbol = '✘'
signal_symbol = '✘'
not_found_symbol = '✘'
not_executable_symbol = '✘'
pipestatus = true
pipestatus_separator = '[|](bright-black)'
format = '\[[$symbol$status]($style)\]'
pipestatus_format = '\[[$pipestatus]($style)[ => $int]($style)\]'

[cmd_duration]
min_time = 2000
style = 'bright-cyan'
format = '\[[󰅐 $duration]($style)\]'

[jobs]
symbol = '󰣖 '
style = 'blue'
number_threshold = 1
format = '\[[$symbol$number]($style)\]'

[hostname]
ssh_only = true
style = 'red'
format = '\[[@$hostname]($style)\]'

[nodejs]
detect_files = ['package.json', '.node-version', '.nvmrc']
symbol = '󰎙 '
style = 'green'
format = '\[[$symbol($version)]($style)\]'

[bun]
symbol = ' '
style = 'bright-white'
format = '\[[$symbol($version)]($style)\]'

[golang]
symbol = ' '
style = 'bright-cyan'
format = '\[[$symbol($version)]($style)\]'

[rust]
symbol = '󱘗 '
style = 'bright-red'
format = '\[[$symbol($version)]($style)\]'

[python]
symbol = '󰌠 '
style = 'bright-yellow'
format = '\[[$symbol($version)(\($virtualenv\))]($style)\]'

[terraform]
symbol = '󱁢 '
style = 'bright-purple'
format = '\[[$symbol$workspace]($style)\]'

[aws]
symbol = ''
style = 'yellow'
format = '\[[$symbol$profile(@$region)]($style)\]'

# Context and namespace, whenever a kubeconfig has a current context.
[kubernetes]
disabled = false
symbol = '󱃾 '
style = 'bright-blue'
format = '\[[$symbol$context( \($namespace\))]($style)\]'

[docker_context]
only_with_files = true
symbol = '󰡨 '
style = 'bright-cyan'
format = '\[[$symbol$context]($style)\]'

[time]
disabled = false
time_format = '%H:%M'
style = 'bright-black'
format = '\[[$time]($style)\]'

[package]
disabled = true
