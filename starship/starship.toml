"$schema" = 'https://starship.rs/config-schema.json'

format = '󰜁 $directory$git_branch$git_state$git_status$line_break$character'
right_format = '$mise$status$cmd_duration$username$hostname$jobs$nodejs$bun$golang$rust$python$ruby$terraform$aws${env_var.STARSHIP_DOCKER_CTX}$time'

add_newline = true
command_timeout = 500

[directory]
style = 'bright-white'
repo_root_style = 'bright-white'
before_repo_root_style = 'bright-white'
truncate_to_repo = false
# The two go together: fish_style only rewrites the part that was truncated, so
# with truncation_length = 0 (unlimited) it would do nothing at all. Parents
# collapse to one letter, the last 4 components stay whole.
truncation_length = 4
fish_style_pwd_dir_length = 1
format = '[$path]($style) '

[character]
success_symbol = '[❯](bright-green)'
error_symbol = '[❯](bright-red)'
vimcmd_symbol = '[❮](bright-green)'
vimcmd_replace_symbol = '[▶](bright-purple)'
vimcmd_replace_one_symbol = '[▶](bright-purple)'
vimcmd_visual_symbol = '[V](bright-yellow)'

[git_branch]
symbol = ' '
style = 'green'
format = '[$symbol$branch]($style) '

[git_state]
style = 'red'
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
ignore_submodules = true
format = '($all_status$ahead_behind )'
conflicted = '[=${count}](red)'
stashed = '[*${count}](cyan)'
staged = '[+${count}](green)'
modified = '[!${count}](yellow)'
untracked = '[?${count}](purple)'
deleted = '[✘${count}](red)'
renamed = '[»${count}](yellow)'
ahead = '[⇡${count}](cyan)'
behind = '[⇣${count}](cyan)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](cyan)'

[mise]
disabled = false
style = 'bright-red'
symbol = ' '
healthy_symbol = ''
unhealthy_symbol = 'mise'
format = '[$symbol$health]($style) '

[status]
disabled = false
style = 'bright-red'
symbol = '✘'
map_symbol = true
recognize_signal_code = true
# map_symbol otherwise brings starship's emoji defaults (🧱 ⚡ 🔍), which are
# double-width and ignore the palette.
sigint_symbol = '✘'
signal_symbol = '✘'
not_found_symbol = '✘'
not_executable_symbol = '✘'
# Without pipestatus only the last command's code is shown, so `curl … | jq .`
# reports jq's success and a failed curl reads as fine.
pipestatus = true
pipestatus_separator = '[|](bright-black)'
# map_symbol replaces $status with the readable variables: SIGINT, not 130.
format = '[$symbol$common_meaning$signal_name$maybe_int]($style) '
pipestatus_format = '[$pipestatus]($style)[ => $int]($style) '

[cmd_duration]
min_time = 2000
style = 'bright-cyan'
format = '[󰅐 $duration]($style) '

[username]
show_always = false
style_user = 'bright-black'
style_root = 'bright-red'
format = '[$user]($style)'

[hostname]
ssh_only = true
style = 'red'
format = '[@$hostname]($style) '

[jobs]
symbol = '󰣖 '
style = 'blue'
format = '[$symbol$number]($style) '

[nodejs]
symbol = '󰎙 '
style = 'bright-green'
format = '[$symbol($version )]($style)'

[bun]
symbol = ' '
style = 'bright-white'
format = '[$symbol($version )]($style)'

[golang]
symbol = ' '
style = 'bright-cyan'
format = '[$symbol($version )]($style)'

[rust]
symbol = '󱘗 '
style = 'bright-red'
format = '[$symbol($version )]($style)'

[python]
symbol = '󰌠 '
style = 'bright-yellow'
format = '[$symbol($version )(\($virtualenv\) )]($style)'

# vesto-api is Rails, so this is the one runtime the prompt was missing.
[ruby]
symbol = '󰴭 '
style = 'red'
format = '[$symbol($version )]($style)'

# Default format is workspace-only, which is also the fast path: asking for
# $version would shell out to `terraform version` on every prompt.
[terraform]
symbol = '󱁢 '
style = 'bright-purple'
format = '[$symbol$workspace]($style) '

[aws]
symbol = ' '
style = 'yellow'
format = '[$symbol$profile]($style) '

# starship's own docker_context module only hides `default`, so `desktop-linux`
# would draw on every prompt. zshrc computes this variable from
# ~/.docker/config.json without forking and leaves it unset when the context is
# one of the two normal ones.
[env_var.STARSHIP_DOCKER_CTX]
variable = 'STARSHIP_DOCKER_CTX'
format = '[󰡨 $env_value](bright-cyan) '

[time]
disabled = false
time_format = '%H:%M'
style = 'bright-black'
format = '[$time]($style) '
