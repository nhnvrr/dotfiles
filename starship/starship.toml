"$schema" = 'https://starship.rs/config-schema.json'

# Only the modules named here are ever evaluated, so the ~40 others starship
# ships (java, ruby, php, package…) cost nothing.
format = '$directory$git_branch$git_state$git_status$line_break$character'
right_format = '$status$cmd_duration$username$hostname$jobs$nodejs$bun$golang$rust$python$terraform$aws${env_var.STARSHIP_DOCKER_CTX}$time'

add_newline = true
command_timeout = 500

# kanso-zen palette by role. The grey is kanso's bright-black #5C6066: against
# the #090E13 background that's 3.06:1, above the 3:1 floor for non-body text.

[directory]
style = 'fg:#8ba4b0'
repo_root_style = 'fg:#7aa89f'
before_repo_root_style = 'fg:#5C6066'
truncate_to_repo = false
truncation_length = 0
format = '[$path]($style) '

[character]
success_symbol = '[❯](fg:#87a987)'
error_symbol = '[❯](fg:#e46876)'
vimcmd_symbol = '[❮](fg:#87a987)'
vimcmd_replace_symbol = '[▶](fg:#938aa9)'
vimcmd_replace_one_symbol = '[▶](fg:#938aa9)'
vimcmd_visual_symbol = '[V](fg:#e6c384)'

[git_branch]
symbol = ' '
style = 'fg:#87a987'
format = '[$symbol$branch]($style) '

[git_state]
style = 'fg:#c4746e'
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# Per-state colours have to be inlined: the module has one $style, and the
# variables are format strings in their own right.
[git_status]
ignore_submodules = true
format = '($all_status$ahead_behind )'
conflicted = '[=${count}](fg:#e46876)'
stashed = '[*${count}](fg:#8ea4a2)'
staged = '[+${count}](fg:#87a987)'
modified = '[!${count}](fg:#e6c384)'
untracked = '[?${count}](fg:#938aa9)'
deleted = '[✘${count}](fg:#e46876)'
renamed = '[»${count}](fg:#e6c384)'
ahead = '[⇡${count}](fg:#7aa89f)'
behind = '[⇣${count}](fg:#7aa89f)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](fg:#7aa89f)'

[status]
disabled = false
style = 'fg:#e46876'
symbol = '✘'
format = '[$symbol$status]($style) '

[cmd_duration]
min_time = 2000
style = 'fg:#7aa89f'
format = '[ $duration]($style) '

[username]
show_always = false
style_user = 'fg:#5C6066'
style_root = 'fg:#e46876'
format = '[$user]($style)'

[hostname]
ssh_only = true
style = 'fg:#c4746e'
format = '[@$hostname]($style) '

[jobs]
symbol = ' '
style = 'fg:#8ba4b0'
format = '[$symbol$number]($style) '

[nodejs]
symbol = ' '
style = 'fg:#87a987'
format = '[$symbol($version )]($style)'

[bun]
symbol = '󰳓 '
style = 'fg:#c5c9c7'
format = '[$symbol($version )]($style)'

[golang]
symbol = ' '
style = 'fg:#7aa89f'
format = '[$symbol($version )]($style)'

[rust]
symbol = ' '
style = 'fg:#e46876'
format = '[$symbol($version )]($style)'

[python]
symbol = '󰌠 '
style = 'fg:#e6c384'
format = '[$symbol($version )(\($virtualenv\) )]($style)'

# Default format is workspace-only, which is also the fast path: asking for
# $version would shell out to `terraform version` on every prompt.
[terraform]
symbol = '󱁢 '
style = 'fg:#938aa9'
format = '[$symbol$workspace]($style) '

[aws]
symbol = ' '
style = 'fg:#e6c384'
format = '[$symbol$profile]($style) '

# starship's own docker_context module only hides `default`, so `desktop-linux`
# would draw on every prompt. zshrc computes this variable from
# ~/.docker/config.json without forking and leaves it unset when the context is
# one of the two normal ones.
[env_var.STARSHIP_DOCKER_CTX]
variable = 'STARSHIP_DOCKER_CTX'
format = '[ $env_value](fg:#7aa89f) '

[time]
disabled = false
time_format = '%H:%M'
style = 'fg:#5C6066'
format = '[$time]($style) '
