"$schema" = 'https://starship.rs/config-schema.json'

# Only the modules named here are ever evaluated, so the ~40 others starship
# ships (java, ruby, php, package…) cost nothing.
format = '$directory$git_branch$git_state$git_status$line_break$character'
right_format = '$mise$status$cmd_duration$username$hostname$jobs$nodejs$bun$golang$rust$python$terraform$aws${env_var.STARSHIP_DOCKER_CTX}$time'

add_newline = true
command_timeout = 500

# Colours by ANSI slot, never hex: the terminal resolves them, so the prompt
# follows whatever theme Ghostty loads instead of pinning one palette here.
# Same reason bat runs with BAT_THEME=ansi.

[directory]
style = 'bright-white'
repo_root_style = 'bright-white'
before_repo_root_style = 'white'
truncate_to_repo = false
truncation_length = 0
format = '[$path]($style) '

[character]
success_symbol = '[❯](bright-green)'
error_symbol = '[❯](bright-red)'
vimcmd_symbol = '[❮](bright-green)'
vimcmd_replace_symbol = '[▶](bright-purple)'
vimcmd_replace_one_symbol = '[▶](bright-purple)'
vimcmd_visual_symbol = '[V](bright-yellow)'

[git_branch]
symbol = '󰊢 '
style = 'bright-green'
format = '[$symbol$branch]($style) '

[git_state]
style = 'red'
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# Per-state colours have to be inlined: the module has one $style, and the
# variables are format strings in their own right.
[git_status]
ignore_submodules = true
format = '($all_status$ahead_behind )'
conflicted = '[=${count}](bright-red)'
stashed = '[*${count}](cyan)'
staged = '[+${count}](bright-green)'
modified = '[!${count}](bright-yellow)'
untracked = '[?${count}](bright-purple)'
deleted = '[✘${count}](bright-red)'
renamed = '[»${count}](bright-yellow)'
ahead = '[⇡${count}](bright-cyan)'
behind = '[⇣${count}](bright-cyan)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](bright-cyan)'

# Callado mientras mise esta sano; sale en rojo solo cuando se rompe, que es
# el caso que de otro modo tarda en notarse.
[mise]
disabled = false
style = 'bright-red'
symbol = '󰀦 '
healthy_symbol = ''
unhealthy_symbol = 'mise'
format = '[$symbol$health]($style) '

[status]
disabled = false
style = 'bright-red'
symbol = '✘'
format = '[$symbol$status]($style) '

[cmd_duration]
min_time = 2000
style = 'bright-cyan'
format = '[󰅐 $duration]($style) '

[username]
show_always = false
style_user = 'bright-black'
style_root = 'bright-red'
format = '[$user]($style)'

[hostname]
ssh_only = true
style = 'red'
format = '[@$hostname]($style) '

[jobs]
symbol = '󰣖 '
style = 'blue'
format = '[$symbol$number]($style) '

[nodejs]
symbol = '󰎙 '
style = 'bright-green'
format = '[$symbol($version )]($style)'

[bun]
symbol = '󰳓 '
style = 'bright-white'
format = '[$symbol($version )]($style)'

[golang]
symbol = '󰟓 '
style = 'bright-cyan'
format = '[$symbol($version )]($style)'

[rust]
symbol = '󱘗 '
style = 'bright-red'
format = '[$symbol($version )]($style)'

[python]
symbol = '󰌠 '
style = 'bright-yellow'
format = '[$symbol($version )(\($virtualenv\) )]($style)'

# Default format is workspace-only, which is also the fast path: asking for
# $version would shell out to `terraform version` on every prompt.
[terraform]
symbol = '󱁢 '
style = 'bright-purple'
format = '[$symbol$workspace]($style) '

[aws]
symbol = '󰸏 '
style = 'bright-yellow'
format = '[$symbol$profile]($style) '

# starship's own docker_context module only hides `default`, so `desktop-linux`
# would draw on every prompt. zshrc computes this variable from
# ~/.docker/config.json without forking and leaves it unset when the context is
# one of the two normal ones.
[env_var.STARSHIP_DOCKER_CTX]
variable = 'STARSHIP_DOCKER_CTX'
format = '[󰡨 $env_value](bright-cyan) '

[time]
disabled = false
time_format = '%H:%M'
style = 'bright-black'
format = '[$time]($style) '
