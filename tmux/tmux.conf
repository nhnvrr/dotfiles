set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:cstyle:ccolour:usstyle:hyperlinks"

set -g default-shell "/bin/zsh"

set -g mouse on
set -g set-clipboard on
set -g history-limit 100000
set -g history-file "$HOME/.local/state/tmux/history"
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

set -g focus-events on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind & kill-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -s copy-command "pbcopy"

bind P command-prompt -p "save scrollback to:" -I "#{pane_current_path}/scrollback.txt" \
  "capture-pane -S - -E - ; save-buffer '%1' ; delete-buffer"
bind C-e run-shell 'f=/tmp/tmux-scrollback.txt; tmux capture-pane -p -S - > "$f"; tmux new-window "${EDITOR:-vi} $f"'

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"
