set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:cstyle:ccolour:usstyle:hyperlinks"

set -g default-shell "/opt/homebrew/bin/fish"

set -g mouse on
set -g set-clipboard on
set -g history-limit 100000
set -g history-file "$HOME/.local/state/tmux/history"
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi

# Off by default: without it nvim never sees FocusGained/FocusLost inside tmux,
# so autoread and any on-focus hook silently stop firing there and nowhere else.
set -g focus-events on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Empty by default, and every copy-pipe binding without an explicit command falls
# back to it — so this is what puts Enter, C-j, D, the mouse drag and the double
# and triple click on the system clipboard, not just y.
set -s copy-command "pbcopy"

# v is rectangle-toggle by default; C-v still is, so nothing is lost by taking it.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# -S - is the whole scrollback and not the visible screen, which is the only
# reason these exist: copy-mode can only ever reach what fits in a selection.
bind P command-prompt -p "save scrollback to:" -I "#{pane_current_path}/scrollback.txt" \
  "capture-pane -S - -E - ; save-buffer '%1' ; delete-buffer"
bind C-e run-shell 'f=/tmp/tmux-scrollback.txt; tmux capture-pane -p -S - > "$f"; tmux new-window "${EDITOR:-vi} $f"'

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# tpm clones into TMUX_PLUGIN_MANAGER_PATH; left unset it lands next to the
# symlinked tmux.conf, which is inside the dotfiles repo.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @resurrect-dir "$HOME/.local/state/tmux/resurrect"
# The whole point of the pair: without it a restored pane comes back empty.
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

# Homebrew's tpm, so install.sh clones nothing. Has to be the last line.
if-shell "[ -x /opt/homebrew/opt/tpm/share/tpm/tpm ]" "run -b /opt/homebrew/opt/tpm/share/tpm/tpm"
if-shell "[ -x /usr/local/opt/tpm/share/tpm/tpm ]" "run -b /usr/local/opt/tpm/share/tpm/tpm"
