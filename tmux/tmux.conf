set -g default-terminal "tmux-256color"
# Matched against the OUTER terminal's TERM, not default-terminal above.
# Alacritty announces itself as `alacritty`, so an xterm-256color-only pattern
# never applies -- and cstyle is what passes DECSCUSR through, which is the
# zsh vi-mode cursor. Both names listed so the config travels.
set -as terminal-features ",alacritty:RGB:cstyle:ccolour:usstyle:hyperlinks"
set -as terminal-features ",xterm-256color:RGB:cstyle:ccolour:usstyle:hyperlinks"

set -g default-shell "/bin/zsh"

set -g mouse on
set -g set-clipboard on
set -g history-limit 100000
set -g history-file "$HOME/.local/state/tmux/history"
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

set -g focus-events on

# alacritty.toml sets dynamic_title, and nothing writes the title from inside
# tmux unless this is on.
set -g set-titles on
set -g set-titles-string "#{session_name} - #{pane_title}"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind & kill-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -r repeats without the prefix, so a resize is prefix once then arrows.
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5

# -d keeps the focus on the window being moved instead of following the swap.
bind -r < swap-window -d -t '{previous}'
bind -r > swap-window -d -t '{next}'

bind C-b last-window

set -s copy-command "pbcopy"

# mode-keys vi above only sets the motions; the selection verbs are separate.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Dimming the inactive pane IS the marking -- nothing else distinguishes the
# active one. Text and ground both: the inactive pane lands at 4.95:1 here and
# 4.49:1 in light, against 16.4 and 18.9 for the active one.
#
# Hex, not slots. There is no named slot a step off the ground, and the quiet
# grey is not the same name in both palettes -- #928374 is slot 19 in gruvbox
# dark, #66707b is `white` in GitHub light. `mate` sets these on switch and the
# if-shell below covers a server started before any switch has run.
#
# Painting the inactive bg is deliberate, and it is what undoes nvim's
# `Normal ctermbg=NONE` while that pane is unfocused. window-active-style must
# be set, and must be `default`: left alone it inherits window-style and dims
# both panes, and a literal ground hex would stop the focused pane from letting
# the terminal's own background through.
set -g window-style 'fg=#928374,bg=#141617'
set -g window-active-style 'fg=default,bg=default'
set -g pane-border-style 'fg=brightblack'

# bg=green,fg=black is tmux's own default and holds at 8:1 on the dark palette.
# It does not on the light one, where green is #024c1a and black #0e1116: 1.9:1,
# dark green under near-black. No slot in the light palette is light enough to
# rescue it -- white is #66707b, 2.1:1 -- so the light branch below puts literal
# white on top. The one hex in this file, for that reason.
#
# Set before the if-shell, like every other option the branch touches: the
# branch has to be the last word on it.
set -g status-style 'bg=green,fg=black'
set -g window-status-current-style 'bold'

# Both borders are the same quiet grey: the border is a rule between panes, not
# a marker. Set explicitly rather than left to the default, because `mate`
# writes it on a live server.
set -g pane-active-border-style 'fg=brightblack'

if-shell '[ "$(cat "${XDG_STATE_HOME:-$HOME/.local/state}/mate/appearance" 2>/dev/null)" = light ]' \
  'set -g window-style fg=#66707b,bg=#f0f2f4 ; set -g pane-border-style fg=white ; set -g pane-active-border-style fg=white ; set -g status-style bg=green,fg=#ffffff'

# Unset, not merely absent: a reload does not clear what a previous config set,
# so `prefix r` on a server that ran the old file would keep drawing the chip.
set -gu pane-border-status
set -gu pane-border-format
set -gu pane-border-indicators
set -gu pane-border-lines

bind P command-prompt -p "save scrollback to:" -I "#{pane_current_path}/scrollback.txt" \
  "capture-pane -S - -E - ; save-buffer '%1' ; delete-buffer"
bind C-e run-shell 'f=/tmp/tmux-scrollback.txt; tmux capture-pane -p -S - > "$f"; tmux new-window "${EDITOR:-vi} $f"'

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"
