set -g default-terminal "tmux-256color"
# hyperlinks: tmux no trae entrada builtin para xterm-ghostty y el terminfo no
# declara Hls, así que sin esto se come los OSC 8 de gh/eza/bat/delta.
set -as terminal-features ",xterm-ghostty:RGB:cstyle:ccolour:usstyle:hyperlinks"
set -as terminal-features ",xterm-256color:RGB:cstyle:ccolour:usstyle:hyperlinks"

set -g cursor-style blinking-bar
set -g default-shell "/opt/homebrew/bin/fish"
set -g default-command "/opt/homebrew/bin/fish -l"
set -g history-limit 100000
set -g mouse on
set -g set-clipboard on
set -g focus-events on
set -g renumber-windows on
set -g escape-time 10
set -g repeat-time 300
setw -g automatic-rename on

# La sesión es un bloque invertido, y se pone cyan mientras el prefix está
# armado: un color propio y no un segmento extra, que sobre la barra verde
# sumaría ruido.
set -g status-left '#{?client_prefix,#[bg=cyan fg=black],#[reverse]} #S #[default] '
set -g status-left-length 24

set -g status-right ' #h  %d/%m %H:%M '
set -g status-right-length 40

set -g mode-style 'reverse'
set -g bell-action any
set -g visual-bell off
setw -g monitor-bell on

# El bell decide el color de toda la barra y #{@x} devuelve su contenido sin
# expandirlo: #{E:} es lo que hace correr el formato de adentro.
set -g @bell '#{m:*1*,#{W:#{window_bell_flag}}}'
set -g status-style '#{?#{E:@bell},bg=yellow fg=black,bg=green fg=black}'

# reverse en vez de un color fijo: la activa se resuelve sola contra la barra
# verde y contra la amarilla del bell, sin repetir el condicional. Y es lo único
# que separa la activa sin recurrir a negrita.
setw -g window-status-current-style reverse
# El default de tmux acá también es reverse, que sobre la barra amarilla queda
# igual que la activa. El '!' de #F ya dice cuál sonó.
setw -g window-status-bell-style default

setw -g window-status-separator ''
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, Z,} '

set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=green'

# Invertidos, no amarillos: el amarillo es con lo que la barra avisa el bell.
set -g message-style 'bg=black fg=green'
set -g message-command-style 'bg=black fg=green'
set -g popup-style 'bg=default'
set -g popup-border-style 'fg=brightblack'

set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
setw -g aggressive-resize on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind x kill-pane
bind & kill-window

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# C-o y no o: 'o' ya es other-end en copy-mode-vi.
bind -T copy-mode-vi C-o send -X copy-pipe-and-cancel "xargs open"

# capture-pane -J une las líneas wrapeadas antes de buscar, que es lo que
# cmd+click no puede hacer: un URL cortado en dos filas del pane.
bind u display-popup -E -w 70% -h 40% "tmux capture-pane -J -p -S -10000 | grep -oE 'https?://[^[:space:]<>()\"]+' | sort -u | tail -r | fzf --reverse --prompt='url> ' | xargs open"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z
bind -r C-k clear-history

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
