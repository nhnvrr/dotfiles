set -g default-terminal "tmux-256color"
# Ghostty setea TERM=xterm-ghostty; sin esto tmux no le pasa truecolor.
# `terminal-features` es la forma moderna (tmux 3.2+) de declarar capacidades:
# a diferencia de `terminal-overrides` no pisa terminfo, lo extiende.
#   RGB      → truecolor
#   cstyle   → DECSCUSR (forma del cursor)
#   ccolour  → OSC 12 (color del cursor)
#   usstyle  → undercurl + color de subrayado (diagnostics de nvim)
#   extkeys  → teclas modificadas vía CSI-u (protocolo Kitty) — habilita atajos
#             como Ctrl+; que un terminal normal no puede distinguir
set -as terminal-features ",xterm-ghostty:RGB:cstyle:ccolour:usstyle:extkeys"
set -as terminal-features ",xterm-256color:RGB:cstyle:ccolour:usstyle"

# Pedir a Ghostty las secuencias CSI-u. Sin esto, extkeys en terminal-features
# no alcanza: hay que activarlo también acá. Solo AGREGA la capacidad de
# distinguir Ctrl+símbolo; los Ctrl+letra de siempre no cambian.
# El format DEBE ser csi-u: el default `xterm` emite \e[27;5;59~, que no matchea
# el bind \e[59;5u de fish. Con csi-u tmux manda \e[59;5u y coinciden.
set -g extended-keys on
set -g extended-keys-format csi-u

# Cursor: beam parpadeante, igual que Ghostty. Opciones nativas de tmux en vez
# del viejo hack `terminal-overrides ",*:Se=\\E[5 q"` — con `cursor-style` tmux
# conoce el estilo base y lo restaura él mismo cuando una app (nvim) lo resetea,
# en vez de mentirle a terminfo sobre qué significa "cursor por defecto".
# Color: nord13 (#EBCB8B), el mismo que fija el theme Nord Wave de Ghostty.
set -g cursor-style blinking-bar
set -g cursor-colour '#EBCB8B'
set -g default-shell "/opt/homebrew/bin/fish"
set -g default-command "/opt/homebrew/bin/fish -l"
set -g history-limit 100000
set -g mouse on
set -g set-clipboard on
set -g focus-events on
set -g renumber-windows on
set -g escape-time 10
set -g repeat-time 300
setw -g automatic-rename on

# status-left: solo la sesión (dev / work / side), que es lo que además define
# el perfil de AWS. Sin colores hardcodeados: hereda el status-style.
set -g status-left '[#S] '
set -g status-left-length 20

# status-right: host y hora. Reemplaza el default de tmux, que mostraba
# pane_title (ruidoso) + fecha. `#h` es el hostname del SERVIDOR de tmux, no el
# de un ssh dentro de un pane — hoy siempre local, pero si algún día corrés
# tmux en una EC2 esa es la señal que importa.
set -g status-right '#h  %H:%M '
set -g status-right-length 40

# Selección en copy-mode (mouse o `v`): el default de tmux es un amarillo
# hardcodeado que desentona con kanso. `reverse` invierte fg/bg de cada celda,
# así se ve siempre legible y toma los colores del theme en vez de imponer uno.
set -g mode-style 'reverse'

# Theme: el default de tmux. Sin hex hardcodeado — los colores ANSI los resuelve
# el terminal, así que la barra sigue al theme de Ghostty sin tocar nada acá.
#
# Bells: status bar entera resaltada mientras haya campana pendiente (ej. Claude
# Code esperando input) + passthrough del BEL a Ghostty, para que el Dock avise
# cuando está en background. El estado normal (`bg=green fg=black`) es
# literalmente el default de tmux.
set -g bell-action any
set -g visual-bell off
setw -g monitor-bell on
# Naranja en alerta. ANSI no tiene naranja entre sus 8 colores base, así que va
# por índice de la paleta 256: del 16 en adelante son valores fijos, a
# diferencia del 0-15 que el theme del terminal remapea. O sea que colour208 es
# el mismo naranja en cualquier theme, sin hardcodear un hex.
# El estado normal (`bg=green fg=black`) es el default de tmux.
set -g status-style '#{?#{m:*1*,#{W:#{window_bell_flag}}},bg=colour208 fg=black,bg=green fg=black}'
setw -g window-status-bell-style 'fg=black,bold'

# Formato de ventana: índice, nombre y flags nativos. Un solo formato para
# activas e inactivas, así los flags salen parejos.
# `#F` ya trae todo lo que hace falta y por eso no hay condicional:
#   *  activa      !  campana      Z  pane zoomeado
#   -  última      #  actividad    ~  silencio
# Antes había un `#{?window_bell_flag,🔔,#F}` que reemplazaba los flags por un
# emoji: además de tapar la Z y el resto mientras sonaba, 🔔 es de doble ancho
# y corría la barra entera al aparecer.
setw -g window-status-format '#I:#W#F'
setw -g window-status-current-format '#I:#W#F'
setw -g window-status-current-style 'fg=black,bold'

set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
setw -g aggressive-resize on

# Keep new splits/windows in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes with prefix + h/j/k/l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Disable confirmation prompts for closing panes/windows.
bind x kill-pane
bind & kill-window

# Clipboard: copy selection to macOS clipboard.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Resize panes with repeatable H/J/K/L.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle pane zoom (maximize/restore).
bind m resize-pane -Z

# Clear pane history.
bind -r C-k clear-history

# Quick reload.
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
