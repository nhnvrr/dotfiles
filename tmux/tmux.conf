set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:cstyle:ccolour:usstyle:hyperlinks"

set -g default-shell "/opt/homebrew/bin/fish"

set -g mouse on
set -g set-clipboard on
set -g history-limit 100000
set -g history-file "$HOME/.local/state/tmux/history"
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

set -g focus-events on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind & kill-window

set -s copy-command "pbcopy"

bind -T copy-mode-vi y send -X copy-pipe-and-cancel

bind P command-prompt -p "save scrollback to:" -I "#{pane_current_path}/scrollback.txt" \
  "capture-pane -S - -E - ; save-buffer '%1' ; delete-buffer"
bind C-e run-shell 'f=/tmp/tmux-scrollback.txt; tmux capture-pane -p -S - > "$f"; tmux new-window "${EDITOR:-vi} $f"'

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @resurrect-dir "$HOME/.local/state/tmux/resurrect"
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

if-shell "[ -x /opt/homebrew/opt/tpm/share/tpm/tpm ]" "run -b /opt/homebrew/opt/tpm/share/tpm/tpm"
if-shell "[ -x /usr/local/opt/tpm/share/tpm/tpm ]" "run -b /usr/local/opt/tpm/share/tpm/tpm"
