set -g default-terminal "tmux-256color"
# Matched against the outer terminal's TERM; cstyle passes cursor shapes through.
set -as terminal-features ",xterm-ghostty:RGB:cstyle:ccolour:usstyle:hyperlinks"

set -g default-shell "/opt/homebrew/bin/fish"

set -g mouse on
set -g set-clipboard on
set -g history-limit 100000
set -g history-file "$HOME/.local/state/tmux/history"
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

set -g focus-events on

set -g set-titles on
set -g set-titles-string "#{session_name} - #{pane_title}"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind & kill-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5

# -d keeps focus on the window being moved.
bind -r < swap-window -d -t '{previous}'
bind -r > swap-window -d -t '{next}'

bind C-b last-window

set -s copy-command "pbcopy"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# A reload does not clear what a previous config set, so unset explicitly.
set -gu pane-border-status
set -gu pane-border-format
set -gu pane-border-indicators
set -gu pane-border-lines
set -gu window-style
set -gu window-active-style
set -gu pane-border-style
set -gu pane-active-border-style
set -gu status-style
set -gu window-status-current-style

bind P command-prompt -p "save scrollback to:" -I "#{pane_current_path}/scrollback.txt" \
  "capture-pane -S - -E - ; save-buffer '%1' ; delete-buffer"
bind C-e run-shell 'f=/tmp/tmux-scrollback.txt; tmux capture-pane -p -S - > "$f"; tmux new-window "${EDITOR:-vi} $f"'

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"
