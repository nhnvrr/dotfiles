# Greys on a #141516 ground, with gruvbox's orange, green and gold in
# red/green/yellow and a teal in cyan. nvim/colors/mate.lua reads this file.
# The bright row is grey except bright red, gruvbox's #cc241d. Under 4.5:1 on
# purpose: bright red 3.34 and slot 8 at 1.61 -- it only carries autosuggestion
# ghost text, fzf's info line and tmux pane borders, which should recede.
[colors.primary]
background = "0x141516"
foreground = "0xc1c1c1"
