# black-metal-bathory greys on a #1d2021 ground, with gruvbox's orange, green
# and gold in red/green/yellow and bathory's teal in cyan. The bright row is
# grey except bright red, gruvbox's #cc241d. Under 4.5:1 on purpose: bright
# red 3.00, orange 4.24, and slot 8 at 1.44 -- it only carries autosuggestion
# ghost text, fzf's info line and tmux pane borders, which should recede.
[colors.primary]
background = "0x1d2021"
foreground = "0xc1c1c1"
dim_foreground = "0xa7a7a7"

[colors.cursor]
cursor = "0xc1c1c1"
text = "0x1d2021"

[colors.normal]
black = "0x1d2021"
red = "0xd65d0e"
green = "0x98971a"
yellow = "0xd79921"
blue = "0x959595"
magenta = "0xa7a7a7"
cyan = "0x799f9f"
white = "0xe2e2e2"

[colors.bright]
black = "0x3a3a3a"
red = "0xcc241d"
green = "0xc4c4c4"
yellow = "0xa0a0a0"
blue = "0xa7a7a7"
magenta = "0xa7a7a7"
cyan = "0xa2a2a2"
white = "0xffffff"

[[colors.indexed_colors]]
color = "#aaaaaa"
index = 16
[[colors.indexed_colors]]
color = "#949494"
index = 17
[[colors.indexed_colors]]
color = "#606060"
index = 18
[[colors.indexed_colors]]
color = "#929292"
index = 19
[[colors.indexed_colors]]
color = "#999999"
index = 20
[[colors.indexed_colors]]
color = "#999999"
index = 21
