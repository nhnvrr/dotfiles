# base16 black-metal-bathory. Same six corrections as nvim/lua/mate/init.lua,
# plus base01/base02 lifted further here: in a buffer they are only paper, out
# here any program may use slots 18-19 as secondary text.
#
#   ground  #000000 -> #1d2021   pure black halates over a full workday
#   base03  #333333 -> #8a8a8a   1.30:1 -> 4.75:1, this is Comment
#   base0F  #444444 -> #949494   1.68:1 -> 5.40:1
#   base08  #5f8787 -> #6a9494   4.14:1 -> 4.90:1
#   base01  #121212 -> #606060   1.14:1 -> 2.61:1, kept lowest, still a surface
#   base02  #222222 -> #929292   1.03:1 -> 5.27:1
#
# base02 does not land on #888888: base0D is already #888888 here and the two
# slots would collapse into one.
[colors.primary]
background = "0x1d2021"
foreground = "0xc1c1c1"
dim_foreground = "0x999999"

[colors.cursor]
cursor = "0xc1c1c1"
text = "0x1d2021"

[colors.normal]
black = "0x1d2021"
red = "0x6a9494"
green = "0xfbcb97"
yellow = "0xe78a53"
blue = "0x888888"
magenta = "0x999999"
cyan = "0xaaaaaa"
white = "0xc1c1c1"

[colors.bright]
black = "0x8a8a8a"
red = "0xaaaaaa"
green = "0x606060"
yellow = "0x929292"
blue = "0x999999"
magenta = "0x999999"
cyan = "0x949494"
white = "0xc1c1c1"

[[colors.indexed_colors]]
color = "#aaaaaa"
index = 16
[[colors.indexed_colors]]
color = "#949494"
index = 17
[[colors.indexed_colors]]
color = "#606060"
index = 18
[[colors.indexed_colors]]
color = "#929292"
index = 19
[[colors.indexed_colors]]
color = "#999999"
index = 20
[[colors.indexed_colors]]
color = "#999999"
index = 21
