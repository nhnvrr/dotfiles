# Mate Light. The same six hues as Mate, re-solved for a light ground: hue angle
# and chroma carried over, lightness chosen so each slot lands on a contrast
# target. Mirroring Mate's ratios one-to-one was tried first and rejected -- it
# pushed yellow to L* 24, where it stops being yellow and reads as brown. The
# targets here are assigned by role instead, which keeps every hue chromatic.
#
# This variant exists for the reflection, not for taste: a #1f1f1f ground emits
# ~4 nits and a lit room bounces 5-30 off the glass, so the dark theme loses.
# This one emits ~264 and wins.

[colors.primary]
background = "#f2f1ee"
foreground = "#36393d"
bright_foreground = "#2a2c2f"

[colors.cursor]
text = "#f2f1ee"
cursor = "#906300"

[colors.vi_mode_cursor]
text = "#f2f1ee"
cursor = "#08649a"

[colors.selection]
background = "#b8c5d6"
text = "CellForeground"

[colors.search.matches]
background = "#906300"
foreground = "#f2f1ee"

[colors.search.focused_match]
background = "#467322"
foreground = "#f2f1ee"

[colors.footer_bar]
background = "#c9d3e1"
foreground = "#36393d"

[colors.line_indicator]
