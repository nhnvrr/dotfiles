# Mate. Saturated enough that the six hues have their own identity, with a real
# value spread -- an earlier pass forced every slot into 6.9-8.2:1 and the whole
# palette flattened into one pastel family. See README for the measurements.
#
# The ground is #1f1f1f and not something darker: below it the screen starts
# working as a mirror at this desk. Every hex here is unchanged from the
# #181818 pass except the neutrals and the two fills, which moved with it.

[colors.primary]
background = "#1f1f1f"
foreground = "#c8ccd2"
bright_foreground = "#dcdfe3"

[colors.cursor]
text = "#1f1f1f"
cursor = "#d9a03f"

[colors.vi_mode_cursor]
text = "#1f1f1f"
cursor = "#5b9bd5"

[colors.selection]
background = "#383f4b"
text = "CellForeground"

[colors.search.matches]
background = "#d9a03f"
foreground = "#1f1f1f"

[colors.search.focused_match]
background = "#86b45e"
foreground = "#1f1f1f"

[colors.footer_bar]
background = "#303540"
foreground = "#c8ccd2"

[colors.line_indicator]
background = "#303540"
foreground = "#d9a03f"

[colors.normal]
black = "#313131"
red = "#e05f5f"
green = "#86b45e"
yellow = "#d9a03f"
blue = "#5b9bd5"
magenta = "#b578d9"
cyan = "#4fb3ab"
white = "#c8ccd2"

[colors.bright]
black = "#a6a6a6"
red = "#ff8b8b"
green = "#a9d67c"
yellow = "#f5c268"
blue = "#83bdf2"
magenta = "#d5a0f5"
cyan = "#75d6cd"
white = "#dcdfe3"
