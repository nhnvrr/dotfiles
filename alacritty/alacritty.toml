[general]
live_config_reload = true

[terminal.shell]
program = "/opt/homebrew/bin/fish"
args = ["-l"]

[window]
decorations = "Buttonless"
decorations_theme_variant = "Dark"
dynamic_title = true
opacity = 0.80
blur = true
option_as_alt = "Both"
padding = { x = 0, y = 0 }

[font]
size = 15

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[font.offset]
y = 0

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[bell]
animation = "EaseOutExpo"
duration = 0
command = "None"

[colors.primary]
background = "#090E13"
foreground = "#c5c9c7"

[colors.cursor]
text = "#090E13"
cursor = "#c5c9c7"

[colors.selection]
text = "#c5c9c7"
background = "#22262D"

[colors.normal]
black = "#090E13"
red = "#c4746e"
green = "#8a9a7b"
yellow = "#c4b28a"
blue = "#8ba4b0"
magenta = "#a292a3"
cyan = "#8ea4a2"
white = "#a4a7a4"

[colors.bright]
black = "#5C6066"
red = "#e46876"
green = "#87a987"
yellow = "#e6c384"
blue = "#7fb4ca"
magenta = "#938aa9"
cyan = "#7aa89f"
white = "#c5c9c7"

# tmux paints the status bar with colour208 when a pane rings the bell, and
# kanso has no orange among the 16 ANSI colours. Defining the index here keeps
# the alert orange while leaving the value owned by the theme file.
[[colors.indexed_colors]]
index = 208
color = "#ff8700"
