[general]
live_config_reload = true
# `mate` adds or removes this line and regenerates
# ~/.config/alacritty/alacritty.toml, which is a real file: live_config_reload
# does not see through a symlink, so a linked config never reloads at all.
# Absent means dark, which is Alacritty's own default palette.
# import = ["~/.config/alacritty/light.toml"]

[window]
startup_mode = "Maximized"
decorations = "Buttonless"
padding = { x = 1, y = 1 }
dynamic_padding = true
option_as_alt = "Both"
dynamic_title = true

[font]
normal = { family = "Ioskeley Mono Term", style = "Regular" }
bold = { family = "Ioskeley Mono Term", style = "Bold" }
italic = { family = "Ioskeley Mono Term", style = "Italic" }
bold_italic = { family = "Ioskeley Mono Term", style = "Bold Italic" }
size = 14
offset = { x = 0, y = 1 }

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[bell]
duration = 0

[terminal]
osc52 = "CopyPaste"

[keyboard]
bindings = [{ key = "K", mods = "Command", chars = "\u000c" }]
