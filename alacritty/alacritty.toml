[general]
live_config_reload = true

[terminal]
shell = { program = "/opt/homebrew/bin/fish", args = ["--login"] }

[window]
# SimpleFullscreen and not Fullscreen: the native one opens a Space of its own,
# and there Hammerspoon's cmd+` stops hiding the window reliably.
startup_mode = "SimpleFullscreen"
decorations = "Buttonless"
decorations_theme_variant = "Dark"
padding = { x = 1, y = 1 }
dynamic_padding = true
opacity = 1.0
# fish sends its Alt-<key> bindings as ESC+key; without this they arrive as
# composed characters instead.
option_as_alt = "Both"

[font]
normal = { family = "MonaspiceAr Nerd Font Mono", style = "Regular" }
size = 12
# There is no font-feature setting and none is needed: Alacritty does no
# shaping, so Monaspace's calt texture healing — which drifts eza's icon
# columns elsewhere — can never fire.
offset = { x = 0, y = 1 }

[cursor]
style = { shape = "Beam", blinking = "On" }
# 0 = never stop blinking. The default gives up after five seconds.
blink_timeout = 0

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# All that is left of the bell: there is no Dock attention and no title marker
# here, so the \a from fish's _notify_long_command shows as a flash.
[bell]
animation = "EaseOutExpo"
duration = 90
color = "#88c0d0"

[keyboard]
bindings = [
  # cmd+w is Quit in the macOS defaults, not "close tab": herdr is not a
  # daemon, so one slip takes every agent with it.
  { key = "W", mods = "Command", action = "None" },
  # herdr already multiplexes; a tab bar on top of it only confuses.
  { key = "T", mods = "Command", action = "None" },
  # Default here is ToggleFullscreen, the native one, which opens a Space.
  { key = "F", mods = "Command|Control", action = "ToggleSimpleFullscreen" },
]

# Nord. The sixteen ANSI slots below are the single source of truth for the whole
# stack: starship, eza, bat, delta, fzf and pgcli all ask by ANSI name and never
# by hex, so editing one line here moves every one of them at once.
#
# Upstream Nord in the fourteen colour slots. Exactly two values are not
# upstream's — the background and slot 8 — and each is explained where it sits.
# Every ratio below is measured against this file's own background.
#
# Dark only, deliberately: Nord is the one palette whose light half nobody
# publishes, and having to invent one is why it was dropped here once already.

[colors.primary]
# Not nord0 itself. It is nord0's own hue and saturation — H220, S16.4% — with
# the value taken from 21.6% down to 10%, so the Nord tint holds and only the
# depth changes. nord0 as a background sat at 9.25:1 against the foreground and
# left slot 8 no room to be legible in both its roles; this is 13.16:1.
background = "#15181e"
foreground = "#d8dee9"   # nord4 — 13.16:1

[colors.cursor]
text = "#15181e"
cursor = "#88c0d0"

# CellForeground, not a hex: it keeps whatever colour the cell already had, so
# selecting text does not flatten syntax highlighting.
[colors.selection]
text = "CellForeground"
background = "#434c5e"   # nord2 — a surface, never text

[colors.normal]
# Slot 0 is a surface here and never text: nothing in this stack paints it as a
# foreground, and pgcli asks for it only as `bg:ansiblack`.
black = "#3b4252"     # nord1
red = "#bf616a"       # 4.35:1 — under AA, and upstream's own value
green = "#a3be8c"     # 8.72:1
yellow = "#ebcb8b"    # 11.38:1
blue = "#81a1c1"      # 6.60:1
magenta = "#b48ead"   # 6.28:1
cyan = "#88c0d0"      # nord8 — 8.89:1
white = "#e5e9f0"     # nord5 — 14.60:1

[colors.bright]
# Slot 8 is the one slot with two jobs — dim text (comments in fish and bat,
# autosuggestion, starship, fzf's info and border) and a background (fzf's bg+,
# fish's selection, pgcli's selected row) — so it is the one slot that cannot be
# transcribed. Nord's own nord3, #4c566a, is 2.41:1 against this background:
# under the 3:1 floor and unreadable as body text. This is nord3 stepped 25%
# toward nord4, which is where both roles clear — 4.00:1 as text, 3.85:1 with
# slot 15 on top.
black = "#6f788a"
# Nord publishes one set of aurora colours, so these five repeat slots 1-5. That
# is upstream's design and not a copy-paste.
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#8fbcbb"      # nord7 — 8.53:1
white = "#eceff4"     # nord6 — 15.42:1

# Alacritty's own UI reads none of the sixteen slots; without these three tables
# the search bar, hint labels and footer paint in its stock base16. The block
# stays on the accent and the background goes on top, which on a palette this
# dark is the readable half of the pair.
[colors.search]
matches = { foreground = "#15181e", background = "#ebcb8b" }         # 11.38:1
focused_match = { foreground = "#15181e", background = "#88c0d0" }   # 8.89:1

[colors.hints]
start = { foreground = "#15181e", background = "#ebcb8b" }   # 11.38:1
end = { foreground = "#15181e", background = "#81a1c1" }     # 6.60:1

[colors.footer_bar]
foreground = "#15181e"
background = "#88c0d0"   # 8.89:1
