
[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
padding = { x = 1, y = 1 }
dynamic_padding = true
# "buttonless" and not "none", for the rounded corners. macOS draws the corner
# rounding as part of the window frame, and "none" removes the frame outright,
# so square corners are what that setting costs — Alacritty has no radius option
# of its own (verified: no such key exists in the 0.17 binary).
#
# The trade is real and goes the other way: "buttonless" drops the three traffic
# lights but keeps the titlebar strip with the window title centred in it. That
# strip is why this was set to "none" before. `window.title` is emptied below to
# make it as unobtrusive as it gets.
#
# It does bring back a drag area, which "none" had given up.
decorations = "buttonless"
option_as_alt = "Both"
# Maximized, and the three modes are genuinely different on macOS:
#
#   Maximized       fills the screen below the menu bar, respecting the usable
#                   area, and stays an ordinary window
#   Fullscreen      covers everything, but moves the window to a Space of its
#                   own, where hammerspoon/init.lua can no longer tile it —
#                   `cmd+alt+2` (setLeftPane) would have nothing to place it
#                   beside
#   SimpleFullscreen  covers everything, menu bar included, and stays in the
#                   current Space
#
# SimpleFullscreen was the choice here and it is wrong on this display. It sizes
# the window to the FULL screen height but leaves the origin at the usable area,
# so the window overshoots the bottom edge by exactly the height of the menu bar
# and the last rows of the terminal render off-screen. Measured: screen 0..982
# with a 33px menu bar, window y=33 h=982, ending at 1015.
#
# Maximized gives up covering the menu bar and gets the geometry right in
# exchange, which is the better half of that trade. Hammerspoon can still tile
# it, which is what ruled out Fullscreen.
#
# There is deliberately no `dimensions` key: Alacritty only honours it when
# startup_mode is "Windowed", so under any other mode it is silently ignored.
# An explicit size means Windowed plus dimensions = { columns, lines } — in
# cells, not pixels — and letting hammerspoon/init.lua place the window.
startup_mode = "Maximized"
opacity = 0.92
blur = true

# Belt and braces: with no titlebar there is nothing to draw the title on, but
# this also stops Alacritty recomputing it on every foreground process change.
dynamic_title = false
title = ""

[scrolling]
history = 10000

[font]
size = 14.0
normal = { family = "JetBrainsMono NFM", style = "Regular" }
bold = { family = "JetBrainsMono NFM", style = "Bold" }
italic = { family = "JetBrainsMono NFM", style = "Italic" }
bold_italic = { family = "JetBrainsMono NFM", style = "Bold Italic" }
offset = { x = 0, y = 1 }
builtin_box_drawing = true

[cursor]
style = { shape = "Beam", blinking = "On" }
unfocused_hollow = true

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[terminal]
osc52 = "CopyPaste"

[bell]
# A flash and nothing else. zsh/zshrc rings this when a command takes longer
# than ten seconds; a `command = { program = "osascript", ... }` here would turn
# each one into a macOS notification, which reaches you behind other windows at
# the cost of a popup — and a popup carrying Script Editor's icon, since
# osascript is what posts it. The flash covers the foreground case, which is the
# one that actually happens.
animation = "EaseOutExpo"
duration = 100
color = '#7fb4ca'

[colors.primary]
background = '#14171d'
foreground = '#C5C9C7'

[colors.cursor]
text = '#14171d'
cursor = '#C5C9C7'

[colors.selection]
background = '#393B44'
foreground = '#C5C9C7'

[colors.normal]
black = '#14171d'
red = '#c4746e'
green = '#8a9a7b'
yellow = '#c4b28a'
blue = '#8ba4b0'
magenta = '#a292a3'
cyan = '#8ea4a2'
white = '#c8c093'

[colors.bright]
black = '#A4A7A4'
red = '#e46876'
green = '#87a987'
yellow = '#e6c384'
blue = '#7fb4ca'
magenta = '#938aa9'
cyan = '#7aa89f'
white = '#C5C9C7'

[[colors.indexed_colors]]
index = 16
color = '#b6927b'

[[colors.indexed_colors]]
index = 17
color = '#b98d7b'

[keyboard]
bindings = [
  { key = "K", mods = "Command", chars = "\u000C" },
  { key = "Back", mods = "Command", chars = "\u0015" },
]
