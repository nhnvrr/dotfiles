# Alacritty. Replaces Terminal.app as the terminal.
#
# The point of the move: Terminal.app kept the sixteen ANSI slots inside
# com.apple.Terminal.plist, which it rewrites on quit — so the palette could
# never be a symlink and had to be re-entered by hand on every machine. Here it
# is a plain file, and this file is now the single source of truth the rest of
# the stack resolves through.

[general]
live_config_reload = true

[env]
# Not "alacritty". The cask does install that terminfo — into ~/.terminfo,
# symlinked inside Alacritty.app — so it resolves locally; the problem is that
# TERM travels over ssh, and almost no remote host has the entry, which breaks
# `clear`, less and nvim there. The cost is that xterm-256color does not
# advertise Smulx, so undercurl degrades to a plain underline. Drop this block
# to get undercurl back and handle the remote side with `infocmp -x alacritty |
# ssh host tic -x -`.
TERM = "xterm-256color"

[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
decorations = "buttonless"
option_as_alt = "Both"     # Terminal.app's "Use Option as Meta Key"
startup_mode = "Maximized"

[scrolling]
history = 10000

[font]
size = 14.0
# NFM, not NF or NFP: only the Mono build renders every Nerd Font glyph in a
# single cell, which is what keeps the eza icon column aligned. See README.
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }

[bell]
# Terminal.app turned the bell into a Dock bounce and a badge; Alacritty has no
# equivalent, and zsh's _notify_long_command relies on a background window still
# reaching you. The flash covers the foreground case, the notification the
# background one. First run asks for notification permission.
animation = "EaseOutExpo"
duration = 100
color = "#539bf5"
command = { program = "osascript", args = [
  "-e",
  "display notification \"Command finished\" with title \"alacritty\"",
] }

# ─── GitHub Dark Dimmed ──────────────────────────────────────────────────────
#
# The sixteen slots below are what starship, zsh-syntax-highlighting, fzf, bat,
# delta, psql and herdr all resolve through — none of them carries a hex.
# Neovim is the one exception and runs the same variant through
# github-nvim-theme's github_dark_dimmed.

[colors.primary]
background = "#22272e"
foreground = "#adbac7"

[colors.cursor]
text   = "#22272e"
cursor = "#adbac7"

[colors.selection]
text       = "CellForeground"
background = "#2e4c77"

[colors.normal]
black   = "#545d68"
red     = "#f47067"
green   = "#57ab5a"
yellow  = "#c69026"
blue    = "#539bf5"
magenta = "#b083f0"
cyan    = "#39c5cf"
white   = "#909dab"

[colors.bright]
black   = "#636e7b"
red     = "#ff938a"
green   = "#6bc46d"
yellow  = "#daaa3f"
blue    = "#6cb6ff"
magenta = "#dcbdfb"
cyan    = "#56d4dd"
white   = "#cdd9e5"

[keyboard]
# Alacritty already ships the macOS cmd bindings (C/V/N/W/Q, +/-/0). These are
# the two Terminal.app had that it does not.
bindings = [
  { key = "K", mods = "Command", chars = "\u000C" },              # clear screen
  { key = "Back", mods = "Command", chars = "\u0015" },           # kill line
]
